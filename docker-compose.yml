services:
  greenmail:
    image: greenmail/standalone:2.1.3
    container_name: mymail-greenmail
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
      - "3465:3465"   # SMTPS
      - "3993:3993"   # IMAPS
      - "8080:8080"   # API
    environment:
      # Override the image default (auth disabled) so username/password are actually checked.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=testuser:testpass@localhost
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3143"]
      interval: 2s
      timeout: 2s
      retries: 20
