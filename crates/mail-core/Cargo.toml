[package]
name = "mail-core"
version = "0.1.0"
edition = "2021"
description = "Headless IMAP + SQLite/FTS5 core for mymail"
license = "MIT"

[dependencies]
async-imap = { version = "0.11.1", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
mail-parser = "0.11"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
tokio-native-tls = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
