[package]
name = "mymail"
version = "0.1.0"
description = "Lightweight cross-platform email client"
authors = ["mymail contributors"]
edition = "2021"

[lib]
name = "mymail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mail-core = { path = "../crates/mail-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
